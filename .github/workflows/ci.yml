name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      - run: bun install --frozen-lockfile
      - run: bun audit --production --audit-level=high
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run mcpb:pack
      - run: bun run spec:sync

      - name: Check that the committed spec matches the live API
        run: |
          if ! git diff --exit-code -- openapi.json src/generated; then
            echo "::error::The live Onio API spec changed. Run 'bun run spec:sync', check the tools, and commit the result."
            exit 1
          fi
